<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกข้อมูลกิจกรรม</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  
  <style>
    /* Fullscreen Overlay Style */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .spinner-container {
      text-align: center;
      color: #fff;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #22c55e;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto 15px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Upload Dropzone Style */
    .upload-dropzone-box {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s;
    }
    .upload-dropzone-box:hover {
      border-color: #3b82f6;
    }
    .file-input-hidden {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .dropzone-icon {
      font-size: 2rem;
      color: #64748b;
      margin-bottom: 8px;
    }
    .hidden {
      display: none !important;
    }
    .existing-file-card, .selected-file-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: #f1f5f9;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .btn-delete-file, .btn-clear-selection {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.2rem;
      cursor: pointer;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <!-- หน้าต่างโหลดระบบข้อมูล ( Fullscreen Loader ) -->
  <div id="loading-overlay" class="overlay">
    <div class="spinner-container">
      <div class="spinner"></div>
      <p class="loading-text">กำลังซิงโครไนซ์ข้อมูลระบบ...</p>
      <!-- เพิ่มแถบ Progress Bar สำหรับหน้า Loading Overlay -->
      <div id="overlay-progress-container" style="display: none; width: 80%; max-width: 300px; margin: 12px auto 0;">
        <div style="background: rgba(255,255,255,0.2); height: 8px; border-radius: 4px; overflow: hidden;">
          <div id="overlay-progress-bar" style="background: #22c55e; height: 100%; width: 0%; transition: width 0.2s;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="fa-solid fa-folder-open me-2"></i>ระบบบันทึกข้อมูลกิจกรรม</a>
      <button class="btn btn-primary" onclick="openAddEventModal()"><i class="fa-solid fa-plus me-1"></i> เพิ่มกิจกรรมใหม่</button>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container my-4">
    <div class="card shadow-sm">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">รายการบันทึกกิจกรรม</h5>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>หัวข้อกิจกรรม</th>
                <th>ประเภทงาน</th>
                <th>ไฟล์แนบ</th>
                <th class="text-center">จัดการ</th>
              </tr>
            </thead>
            <tbody id="event-table-body">
              <!-- ข้อมูลจะถูกโหลดเข้ามาผ่าน JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal ฟอร์มบันทึก/แก้ไขข้อมูล -->
  <div class="modal fade" id="form-modal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="formModalLabel">บันทึกข้อมูลกิจกรรม</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="closeFormModal()"></button>
        </div>
        <form id="event-form" onsubmit="handleFormSubmit(event)">
          <div class="modal-body">
            <input type="hidden" id="event-id">
            
            <div class="mb-3">
              <label for="event-title" class="form-label">ชื่อกิจกรรม / หัวข้องาน <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="event-title" required placeholder="ระบุชื่อกิจกรรม">
            </div>

            <div class="mb-3">
              <label for="event-category" class="form-label">ประเภทงาน <span class="text-danger">*</span></label>
              <select class="form-select" id="event-category" required>
                <option value="">-- เลือกประเภทงาน --</option>
                <option value="เอกสารคำสั่ง">เอกสารคำสั่ง</option>
                <option value="ป้ายงาน/ประชาสัมพันธ์">ป้ายงาน/ประชาสัมพันธ์</option>
                <option value="กิจกรรมทั่วไป">กิจกรรมทั่วไป</option>
              </select>
            </div>

            <div class="form-group mb-3">
              <label class="form-label">แนบไฟล์เอกสารคำสั่ง / ป้ายงาน <span class="text-danger">*</span></label>

              <!-- กรณีมีไฟล์แนบเดิม -->
              <div id="edit-attachment-status" class="existing-file-card hidden">
                <div class="file-icon-box"><i class="fa-solid fa-file-arrow-up text-primary"></i></div>
                <div class="file-info-text ms-2">
                  <span class="file-name-label d-block fw-bold">ตรวจพบไฟล์แนบดั้งเดิม</span>
                  <a href="#" id="edit-attachment-link" target="_blank" class="file-link-action small">เปิดดูภาพเดิม</a>
                </div>
                <button type="button" class="btn-delete-file" onclick="markAttachmentForDeletion()"><i class="fa-solid fa-trash"></i></button>
              </div>

              <!-- Zone สำหรับเลือก/ลากไฟล์ -->
              <div id="upload-dropzone" class="upload-dropzone-box">
                <input type="file" id="form-file-input" class="file-input-hidden" onchange="handleFileSelection(event)">
                <div class="dropzone-prompt">
                  <i class="fa-solid fa-cloud-arrow-up dropzone-icon"></i>
                  <p class="primary-text mb-1 fw-bold">กดคลิกเพื่อเลือกไฟล์ หรือลากไฟล์มาวางเพื่ออัปโหลด</p>
                  <p class="secondary-text text-muted small mb-0">รองรับภาพ, เอกสาร PDF และเสียง (ไม่เกิน 30MB)</p>
                </div>

                <div id="selected-file-display" class="selected-file-card hidden">
                  <i class="fa-solid fa-file-circle-check text-success file-status-icon" style="font-size:1.5rem"></i>
                  <div class="selected-file-meta ms-2">
                    <span id="selected-file-name" class="file-title d-block fw-bold">filename.jpg</span>
                    <span id="selected-file-size" class="file-size text-muted small">0 KB</span>
                  </div>
                  <button type="button" class="btn-clear-selection" onclick="clearFileSelection()">&times;</button>
                </div>
              </div>

              <!-- ข้อความบอกสถานะ & แถบ Progress Bar ใน Modal -->
              <div id="uploadStatusText" class="text-sm text-primary my-2 fw-bold"></div>
              <div class="progress my-2" style="height: 10px; display: none;" id="progressContainer">
                <div id="uploadProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 0%"></div>
              </div>
            </div>

            <div class="mb-3">
              <label for="event-description" class="form-label">รายละเอียดเพิ่มเติม</label>
              <textarea class="form-control" id="event-description" rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="closeFormModal()">ยกเลิก</button>
            <button type="submit" class="btn btn-success" id="btn-save"><i class="fa-solid fa-floppy-disk me-1"></i> บันทึกข้อมูล</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom Application Script -->
  <script src="script.js"></script>
</body>
</html>
